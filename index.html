<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【宴芸】脸与心孰软</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 去掉点击蓝色高亮 */
        }

        body {
            min-height: 100vh;
            background: #F5F0E8;
            overflow-x: hidden;
            position: relative;
            cursor: pointer;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* 点击水波纹效果 - 小尺寸，不规则 */
        .ripple {
            position: fixed;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 9999;
        }

        .ripple svg {
            width: 100%;
            height: 100%;
            animation: ripple-spin 0.6s ease-out forwards;
        }

        @keyframes ripple-spin {
            0% {
                transform: scale(0.5) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: scale(2) rotate(180deg);
                opacity: 0;
            }
        }

        /* 播放器容器 */
        .player-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            position: relative;
        }

        /* 装饰线条 */
        .decoration-line {
            width: 60px;
            height: 1px;
            background: #6f8d76;
            position: relative;
            opacity: 0.6;
        }

        .decoration-line::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #6f8d76;
            top: 50%;
            transform: translateY(-50%);
        }

        .decoration-line.left::before {
            right: 0;
        }

        .decoration-line.right::before {
            left: 0;
        }

        /* 水波纹播放器 - 变小 */
        .player {
            position: relative;
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        .player-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1.5px solid #6f8d76;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(245, 240, 232, 0.9);
            transition: all 0.3s ease;
        }

        .player:hover .player-circle {
            border-color: #C45C5C;
            transform: scale(1.05);
        }

        /* 涟漪效果 - 多层同心圆，慢慢放大 */
        .ripple-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(111, 141, 118, 0.5);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .player.playing .ripple-ring:nth-child(1) {
            animation: ripple-expand 2s ease-out infinite;
        }

        .player.playing .ripple-ring:nth-child(2) {
            animation: ripple-expand 2s ease-out 0.4s infinite;
        }

        .player.playing .ripple-ring:nth-child(3) {
            animation: ripple-expand 2s ease-out 0.8s infinite;
        }

        @keyframes ripple-expand {
            0% {
                width: 50px;
                height: 50px;
                opacity: 0.6;
            }
            100% {
                width: 100px;
                height: 100px;
                opacity: 0;
            }
        }

        /* 播放按钮图标 */
        .play-icon {
            width: 0;
            height: 0;
            border-left: 12px solid #6f8d76;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            margin-left: 3px;
            transition: all 0.3s ease;
        }

        .player:hover .play-icon {
            border-left-color: #C45C5C;
        }

        .pause-icon {
            display: none;
            width: 14px;
            height: 16px;
            position: relative;
        }

        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 100%;
            background: #6f8d76;
            top: 0;
        }

        .pause-icon::before {
            left: 2px;
        }

        .pause-icon::after {
            right: 2px;
        }

        .player.playing .play-icon {
            display: none;
        }

        .player.playing .pause-icon {
            display: block;
        }

        /* 音乐信息 */
        .music-info {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #6f8d76;
            font-family: "SimSun", "宋体", serif;
            opacity: 0.8;
        }

        /* 示例文字区域 */
        .content {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            font-family: "SimSun", "宋体", serif;
            line-height: 2;
            color: #3D3D3D;
            font-size: 16px;
        }

        .content h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
            color: #3D3D3D;
            font-weight: normal;
        }

        .content .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6f8d76;
            margin-bottom: 40px;
        }

        .content p {
            text-indent: 2em;
            margin-bottom: 1em;
        }
    </style>
</head>
<body>

    <!-- 播放器 -->
    <div class="player-container">
        <div class="decoration-line left"></div>
        
        <div class="player" id="player" onclick="toggleMusic(event)">
            <div class="ripple-ring"></div>
            <div class="ripple-ring"></div>
            <div class="ripple-ring"></div>
            <div class="player-circle">
                <div class="play-icon"></div>
                <div class="pause-icon"></div>
            </div>
        </div>
        
        <div class="decoration-line right"></div>
    </div>
    
    <div class="music-info">华年（二胡版）</div>

    <!-- 音频 -->
    <audio id="music" src="华年(二胡版).mp3" preload="metadata"></audio>

    <!-- 示例内容 -->
    <div class="content">
        <h1>【宴芸】脸与心孰软</h1>
        <div class="subtitle">记一次失败的教育</div>
        <p>家长教育小孩，心软是大忌。但……不是我心软，是他脸软。</p>
        <p>那一年，莫芸刚认识容聿不久。对于一个在青云宗外门活得如一株背景板竹子的人来说，容聿的出现，不亚于竹间飞入朱鸿鸟，乏善可陈的日子变得鲜活起来。</p>
    </div>

    <script>
        // 点击屏幕水波纹
        document.addEventListener('click', function(e) {
            // 如果点击的是播放器，不触发屏幕水波纹
            if (e.target.closest('.player')) return;
            
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            
            // 创建SVG涟漪
            ripple.innerHTML = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10 C30 10, 10 30, 10 50 C10 70, 30 90, 50 90 C70 90, 90 70, 90 50 C90 30, 70 10, 50 10 Z" 
                          fill="none" 
                          stroke="#6f8d76" 
                          stroke-width="1.5" 
                          opacity="0.6"/>
                    <path d="M50 25 C38 25, 25 38, 25 50 C25 62, 38 75, 50 75 C62 75, 75 62, 75 50 C75 38, 62 25, 50 25 Z" 
                          fill="none" 
                          stroke="#6f8d76" 
                          stroke-width="1" 
                          opacity="0.4"/>
                    <path d="M50 38 C44 38, 38 44, 38 50 C38 56, 44 62, 50 62 C56 62, 62 56, 62 50 C62 44, 56 38, 50 38 Z" 
                          fill="none" 
                          stroke="#6f8d76" 
                          stroke-width="0.8" 
                          opacity="0.3"/>
                </svg>
            `;
            
            ripple.style.left = (e.clientX - 30) + 'px';
            ripple.style.top = (e.clientY - 30) + 'px';
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        });

        // 播放器控制
        const player = document.getElementById('player');
        const music = document.getElementById('music');
        let isPlaying = false;

        function toggleMusic(event) {
            event.stopPropagation(); // 阻止冒泡，避免触发屏幕水波纹
            
            if (isPlaying) {
                music.pause();
                player.classList.remove('playing');
                isPlaying = false;
            } else {
                music.play().catch(e => console.log('播放失败:', e));
                player.classList.add('playing');
                isPlaying = true;
            }
        }

        // 音乐结束时重置
        music.addEventListener('ended', function() {
            player.classList.remove('playing');
            isPlaying = false;
        });
    </script>

</body>
</html>
